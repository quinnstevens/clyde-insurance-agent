services:
  interview-db:
    # Postgres 17 with the pgvector extension, which the FAQ search needs. Same data format as postgres:17.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    ports:
      - 2534:5432 # "CLDH" on a phone keypad; avoids clashing with another Postgres on 5432
    environment:
      - POSTGRES_USER=interview
      - POSTGRES_PASSWORD=interview
      - POSTGRES_DB=interview
    volumes:
      - interview-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U interview']
      interval: 2s
      timeout: 2s
      retries: 10

  # Throwaway database for tests that need a real Postgres. Data lives in tmpfs and vanishes on stop.
  interview-db-test:
    image: pgvector/pgvector:pg17
    ports:
      - 5433:5432
    environment:
      - POSTGRES_USER=interview-test
      - POSTGRES_PASSWORD=interview-test
      - POSTGRES_DB=interview_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U interview-test']
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  interview-db-data:
